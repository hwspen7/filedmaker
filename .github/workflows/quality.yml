name: Quality
on:
  push:
    branches: [main, feature/schottenstein-audience-preview, feature/schottenstein-full-3d-architecture]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, geometry and server tests
        run: npm run verify
