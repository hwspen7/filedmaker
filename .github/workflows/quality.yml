name: Quality
on:
  push:
    branches: [main, feature/schottenstein-audience-preview, feature/schottenstein-full-3d-architecture, feature/big-ten-arena-parity]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PDF renderer dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify syntax, geometry and server tests
        run: npm run verify
      - name: Prepare Chrome for real browser acceptance
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Test OSU references and custom workbench in WebGL2
        run: npm run test:workbench-browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Save visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filedmaker-workbench-visual-acceptance
          path: artifacts/visual/*.png
          retention-days: 14
          if-no-files-found: warn
